<!doctype html>
<html lang="en" data-phosphor="amber">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite Review</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: auto;
        height: auto;
      }
      #gallery {
        padding: 12px 16px 40px;
      }
      .g-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .g-sec {
        margin: 0 0 14px;
        padding: 8px 0;
        border-top: 1px solid var(--line, var(--ph-dim));
      }
      .g-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 4px 0;
      }
      .g-label {
        width: 90px;
        flex: 0 0 auto;
        color: var(--ph-dim);
      }
      .g-frames {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .g-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 14px;
        color: var(--ph-dim);
      }
      .g-live,
      .g-frame {
        image-rendering: pixelated;
        width: calc(var(--sw) * var(--px) * 1px);
        height: calc(var(--sh) * var(--px) * 1px);
        background: var(--bg-raise);
        outline: 1px solid var(--line, var(--ph-dim));
      }
      .g-cards {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .g-col {
        flex: 0 0 auto;
        border-right: 1px solid var(--ph-dim);
        border-left: 1px solid var(--ph-dim);
      }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module" src="./src/sprites/gallery.ts"></script>
  </body>
</html>
