# Phosphor-OS OS theme. Generated by os/tools/build-themes.mjs from palettes.mjs.
# Omarchy 4 shell surfaces (bar, launcher, menus, notifications, OSD, lock, polkit).
# Shipping this file replaces the one Omarchy would generate from colors.toml.
# Your own ~/.config/omarchy/shell.toml still wins over it, key by key.

[bar]
background       = "#010a03"
background-alpha = 1.0
text             = "#33ff66"
# Recording, alerts, updates.
active           = "#b6ffc9"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#33ff66"
active-border-foreground = "#33ff66"

[controls]
# Same alphas as the app's buttons: idle border 0.55, hover fill 0.15, chosen fill 0.16 with a full border.
normal-color        = "#33ff66"
normal-fill-alpha   = 0.04
normal-border       = "#33ff66"
normal-border-width = 1
normal-border-alpha = 0.55

hover-cursor-color        = "#b6ffc9"
hover-cursor-fill-alpha   = 0.15
hover-cursor-border       = "#33ff66"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "#b6ffc9"
focus-fill-alpha   = 0.15
focus-border       = "#33ff66"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "#33ff66"
selected-fill-alpha   = 0.16
selected-border       = "#33ff66"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.3
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
# The font family is system-wide in Omarchy 4 (omarchy font set), not part of a theme. With VT323 try base-size = 16.
base-size = 12

[popups]
background       = "#010a03"
background-alpha = 1.0
text             = "#33ff66"
border           = "#33ff66"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#010a03"
background-alpha = 0.97
text             = "#33ff66"
border           = "#23a845"
border-alpha     = 1.0

[notifications]
background       = "#010a03"
background-alpha = 1.0
text             = "#33ff66"
border           = "#33ff66"
border-alpha     = 1.0
border-width     = 2
countdown        = "#b6ffc9"

[launcher]
background                = "#010a03"
background-alpha          = 0.97
text                      = "#33ff66"
border                    = "#33ff66"
border-alpha              = 1.0
border-width              = 2
scrim                     = "#000000"
scrim-alpha               = 0.6
selected-background       = "#33ff66"
selected-background-alpha = 0.16
selected-text             = "#b6ffc9"
selected-border           = "#33ff66"
selected-border-alpha     = 1.0
selected-border-width     = 1

[menu]
background                = "#010a03"
background-alpha          = 1.0
text                      = "#33ff66"
border                    = "#33ff66"
border-alpha              = 1.0
border-width              = 2
scrim                     = "#000000"
scrim-alpha               = 0.6
selected-background       = "#33ff66"
selected-background-alpha = 0.16
selected-text             = "#b6ffc9"
selected-border           = "#33ff66"
selected-border-alpha     = 1.0
selected-border-width     = 1

[polkit]
background       = "#010a03"
background-alpha = 1.0
text             = "#33ff66"
text-error       = "#dfff4f"
border           = "#33ff66"
border-error     = "#dfff4f"
border-alpha     = 1.0
border-width     = 2
scrim            = "#000000"
scrim-alpha      = 0.6
accent           = "#b6ffc9"

[lock]
background       = "#010a03"
background-alpha = 0.85
text             = "#b6ffc9"
placeholder      = "#23a845"
text-error       = "#dfff4f"
border           = "#23a845"
border-active    = "#33ff66"
border-error     = "#dfff4f"
border-alpha     = 1.0
border-width     = 2
selection        = "#33ff66"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.6
text                    = "#33ff66"
selected-border         = "#33ff66"
selected-border-alpha   = 1.0
unselected-border       = "#23a845"
unselected-border-alpha = 0.5
