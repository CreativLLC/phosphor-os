# Phosphor-OS OS theme. Generated by os/tools/build-themes.mjs from palettes.mjs.
# Omarchy 4 shell surfaces (bar, launcher, menus, notifications, OSD, lock, polkit).
# Shipping this file replaces the one Omarchy would generate from colors.toml.
# Your own ~/.config/omarchy/shell.toml still wins over it, key by key.

[bar]
background       = "#000000"
background-alpha = 1.0
text             = "#ff9900"
# Recording, alerts, updates.
active           = "#cc4444"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#ff9900"
active-border-foreground = "#ffcc66"

[controls]
# Idle controls have a lavender rim; hovered and chosen ones turn orange, chosen ones with a thick left edge.
normal-color        = "#ffcc99"
normal-fill-alpha   = 0.06
normal-border       = "#9999cc"
normal-border-width = 1
normal-border-alpha = 0.55

hover-cursor-color        = "#ff9900"
hover-cursor-fill-alpha   = 0.15
hover-cursor-border       = "#ff9900"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "#ff9900"
focus-fill-alpha   = 0.15
focus-border       = "#ff9900"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "#ff9900"
selected-fill-alpha   = 0.22
selected-border       = "#ff9900"
selected-border-width = "0 0 0 4"
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.3
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
# The font family is system-wide in Omarchy 4 (omarchy font set), not part of a theme.
base-size = 12

[popups]
background       = "#000000"
background-alpha = 1.0
text             = "#ffcc99"
border           = "#ff9900"
border-alpha     = 1.0
border-width     = "2 2 2 10"

[tooltip]
background       = "#000000"
background-alpha = 0.97
text             = "#ffcc99"
border           = "#9999cc"
border-alpha     = 1.0

[notifications]
background       = "#000000"
background-alpha = 1.0
text             = "#ffcc99"
border           = "#ffcc66"
border-alpha     = 1.0
border-width     = "2 2 2 10"
countdown        = "#ff9900"

[launcher]
background                = "#000000"
background-alpha          = 0.97
text                      = "#ffcc99"
border                    = "#ff9900"
border-alpha              = 1.0
border-width              = "2 2 2 10"
scrim                     = "#000000"
scrim-alpha               = 0.6
selected-background       = "#ff9900"
selected-background-alpha = 0.22
selected-text             = "#ffcc66"
selected-border           = "#ff9900"
selected-border-alpha     = 1.0
selected-border-width     = "0 0 0 6"

[menu]
background                = "#000000"
background-alpha          = 1.0
text                      = "#ffcc99"
border                    = "#ff9900"
border-alpha              = 1.0
border-width              = "2 2 2 10"
scrim                     = "#000000"
scrim-alpha               = 0.6
selected-background       = "#ff9900"
selected-background-alpha = 0.22
selected-text             = "#ffcc66"
selected-border           = "#ff9900"
selected-border-alpha     = 1.0
selected-border-width     = "0 0 0 6"

[polkit]
background       = "#000000"
background-alpha = 1.0
text             = "#ffcc99"
text-error       = "#cc4444"
border           = "#ff9900"
border-error     = "#cc4444"
border-alpha     = 1.0
border-width     = "2 2 2 10"
scrim            = "#000000"
scrim-alpha      = 0.6
accent           = "#ff9900"

[lock]
background       = "#000000"
background-alpha = 0.85
text             = "#fff0e0"
placeholder      = "#9999cc"
text-error       = "#cc4444"
border           = "#9999cc"
border-active    = "#ff9900"
border-error     = "#cc4444"
border-alpha     = 1.0
border-width     = "2 2 2 10"
selection        = "#ff9900"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.6
text                    = "#ffcc99"
selected-border         = "#ff9900"
selected-border-alpha   = 1.0
unselected-border       = "#9999cc"
unselected-border-alpha = 0.5
